<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline — Goods for the long way</title>
  <meta name="description" content="Northline. Canvas, wool, brass, and steel goods made to be carried and kept." />
  <meta name="theme-color" content="#f3eee6" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,520&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 18.6 12.2 28.5 16 18.6 19.8 16 29.5 13.4 19.8 3.5 16 13.4 12.2 16 2.5Z" fill="currentColor"/>
      </svg>
      <span data-shop-name>Northline</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/shop" data-nav="shop">Shop</a>
      <a href="#/notes" data-nav="notes">Field notes</a>
    </nav>
    <button class="cart-btn" type="button" data-action="open-drawer">
      <span>Cart</span>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="wrap foot-grid">
      <div>
        <p class="foot-brand" data-shop-name>Northline</p>
        <p class="fine">Goods for the long way. Canvas, wool, brass, and steel.</p>
      </div>
      <div>
        <p class="foot-label">Visit</p>
        <a href="#/shop">The shop</a>
        <a href="#/notes">Field notes</a>
        <a href="#/cart">Your cart</a>
      </div>
      <div>
        <p class="foot-label">Catalog</p>
        <p class="fine" id="catalog-source">Eight pieces, held in the page.</p>
      </div>
    </div>
  </footer>
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-action="close-drawer"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header>
        <h2 id="drawer-title">Your cart</h2>
        <button class="icon-btn" type="button" data-action="close-drawer" aria-label="Close cart">×</button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
